name: Release

# When a GitHub release is published (tag v<version>), build the app, pack the DMG and attach it to the release.
# Secrets are all optional; without them the DMG is ad hoc signed (right-click › Open). See docs/releasing.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (v0.2)
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
      DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Tools
        run: brew install xcodegen

      - name: Import Developer ID certificate
        if: ${{ env.DEVELOPER_ID_CERT_P12 != '' }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS=$(uuidgen)
          echo "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Notarization profile
        if: ${{ env.NOTARY_APPLE_ID != '' }}
        run: |
          xcrun notarytool store-credentials rawboy-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          echo "NOTARY_PROFILE=rawboy-notary" >> "$GITHUB_ENV"

      - name: Sparkle key
        run: |
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
            echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"
          else
            echo "SKIP_APPCAST=1" >> "$GITHUB_ENV"
          fi

      - name: Build and pack DMG
        run: tools/release.sh "${TAG#v}"

      - name: Attach DMG to the release
        run: gh release upload "$TAG" build/release/RawBoy-Viewer-*.dmg --clobber

      - name: Update the Sparkle feed
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp build/release/appcast/appcast.xml appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet || { git commit -m "Update feed: ${TAG#v}"; git push origin main; }

      - name: Remove secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle.key"
