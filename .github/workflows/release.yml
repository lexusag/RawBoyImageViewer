name: Release

# When a GitHub release is published (tag v<version>), build the app, sign & notarize the DMG (when MACOS_CERT_P12 is
# set), and attach it to the release. Without MACOS_CERT_P12 the DMG falls back to ad-hoc signing (right-click › Open).
# Secrets: MACOS_CERT_P12, MACOS_CERT_PASSWORD, APPLE_NOTARY_KEY, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID, and
# (optional) SPARKLE_PRIVATE_KEY. See docs/releasing.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (v0.2)
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Tools
        run: brew install xcodegen

      - name: Set up signing and notarization
        run: |
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "::warning::MACOS_CERT_P12 is not set; building an ad-hoc signed, unnotarized DMG (see docs/releasing.md)"
            exit 0
          fi

          for var in MACOS_CERT_PASSWORD APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::MACOS_CERT_P12 is set, but $var is missing (see docs/releasing.md)"
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_pass=$(openssl rand -base64 32)
          cert_path="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12" | tr -d '[:space:]' | base64 --decode > "$cert_path"

          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$cert_path" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$cert_path"

          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' certificate found in MACOS_CERT_P12"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "Signing identity: $identity"

          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_KEY" | tr -d '[:space:]' | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          {
            echo "DEVELOPER_ID=$identity"
            echo "KEYCHAIN=$keychain"
            echo "APPLE_NOTARY_KEY_FILE=$key_path"
          } >> "$GITHUB_ENV"

      - name: Sparkle key
        run: |
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
            echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"
          else
            echo "SKIP_APPCAST=1" >> "$GITHUB_ENV"
          fi

      - name: Build, sign, notarize, and pack DMG
        run: tools/release.sh "${TAG#v}"

      - name: Verify the app inside the DMG
        run: |
          MNT="$RUNNER_TEMP/dmg"
          mkdir -p "$MNT"
          hdiutil attach build/release/RawBoy-Viewer-*.dmg -mountpoint "$MNT" -nobrowse -quiet
          APP="$MNT/RawBoy Viewer.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|TeamIdentifier|Signature"
          codesign -dv "$APP/Contents/Frameworks/Sparkle.framework" 2>&1 | grep -E "TeamIdentifier|Signature"
          # Launch it for a few seconds: a dyld failure (library signature, Team ID) aborts it at once (exit 134).
          ditto "$APP" "$RUNNER_TEMP/RawBoyViewer.app"
          hdiutil detach "$MNT" -quiet
          "$RUNNER_TEMP/RawBoyViewer.app/Contents/MacOS/RawBoy Viewer" & PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "Launched fine"; kill $PID; else wait $PID; echo "App exited early with $?" >&2; exit 1; fi

      - name: Attach DMG to the release
        run: gh release upload "$TAG" build/release/RawBoy-Viewer-*.dmg --clobber

      - name: Update the Sparkle feed
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp build/release/appcast/appcast.xml appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet || { git commit -m "Update feed: ${TAG#v}"; git push origin main; }

      - name: Remove signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key"

  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android signing
        working-directory: android
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; release APK will use debug signing."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Test & build release APK
        working-directory: android
        run: |
          VERSION="${TAG#v}"
          BUILD="$(git rev-list --count HEAD)"
          echo "Building Android APK $VERSION (versionCode $BUILD)"
          ./gradlew :core:test :app:assembleRelease \
            -PversionName="$VERSION" \
            -PversionCode="$BUILD"

      - name: Attach APK to the release
        run: |
          VERSION="${TAG#v}"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          OUT="RawBoy-Viewer-${VERSION}.apk"
          cp "$APK" "$OUT"
          gh release upload "$TAG" "$OUT" --clobber

      - name: Remove signing files
        if: always()
        run: rm -f android/release.jks android/keystore.properties

