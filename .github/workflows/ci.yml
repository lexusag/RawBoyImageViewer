name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the app changed. A skipped `build` job counts as passing for required checks,
  # so pull requests that only touch docs still merge without waiting for a macOS runner.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Did the app change?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Not the app: docs, licence, the Sparkle feed (the release workflow pushes it), branding sources.
          # Anything else (Swift, project.yml, resources, Package files, tools/, workflows) builds.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit: building."
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$files"
          if echo "$files" | grep -Evq '^(docs/|branding/|.*\.md$|LICENSE$|appcast\.xml$|\.gitignore$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs and similar changed: skipping the build."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: swift format lint --strict -r App Features Theme Packages/Sources Packages/Tests Packages/Package.swift

      - name: Package tests
        run: swift test --package-path Packages

      - name: Generate project
        run: brew install xcodegen && xcodegen

      - name: Build app
        run: >
          xcodebuild -project RawBoyViewer.xcodeproj -scheme RawBoyViewer -configuration Debug
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

  # One check to mark as required in branch protection: green when the build passed or was skipped
  # because only docs changed, red when anything failed or was cancelled.
  ci-passed:
    name: CI passed
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
