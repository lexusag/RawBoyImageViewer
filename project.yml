# RawBoy Viewer (macOS). Generate the Xcode project with `xcodegen` in this folder (the .xcodeproj is git-ignored).
# Shared code lives in the local Swift package Packages/ (`swift test --package-path Packages`).
name: RawBoyViewer
options:
  bundleIdPrefix: app.rawboy
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  RawBoyViewerPackages:
    path: Packages
  # Auto-update: the feed is appcast.xml in this repository, the DMGs are GitHub release assets (docs/releasing.md).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  RawBoyViewer:
    type: application
    platform: macOS
    # Signing lives here (ad hoc unless Config/Signing.local.xcconfig names a certificate).
    configFiles:
      Debug: Config/RawBoyViewer.xcconfig
      Release: Config/RawBoyViewer.xcconfig
    sources:
      - App
    dependencies:
      - package: RawBoyViewerPackages
        product: RawBoyBrowseKit
      - package: RawBoyViewerPackages
        product: ViewerFiles
      - package: RawBoyViewerPackages
        product: ViewerImaging
      - package: RawBoyViewerPackages
        product: ViewerUI
      - package: Sparkle
        product: Sparkle
    info:
      path: build/generated/Info.plist
      properties:
        CFBundleDisplayName: RawBoy Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: "15.0"
        # Sparkle: where updates are announced, and the key their signatures must match.
        SUFeedURL: https://raw.githubusercontent.com/lexusag/RawBoyImageViewer/main/appcast.xml
        SUPublicEDKey: "Bl2hd+5HmsGBI/sB8AIDPoBJMr791oxBCbuaMfEr88w="
        # "Open With" for every photo type the viewer shows (RawBoyBrowseKit's PhotoFileType) and for folders; never the
        # default app for a type on its own (rank Alternate). Camera raws: the parent type covers every raw macOS knows.
        CFBundleDocumentTypes:
          - CFBundleTypeName: RAW photo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.camera-raw-image, com.adobe.raw-image, app.rawboy.kdc-raw-image, app.rawboy.x3f-raw-image]
          - CFBundleTypeName: Photo
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg, public.heic, public.heif, public.png, public.tiff, org.webmproject.webp, public.avif, public.jpeg-xl]
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        # Raw formats macOS has no type for (extensions kdc, x3f), so Open With can offer the app for them.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.rawboy.kdc-raw-image
            UTTypeDescription: Kodak raw image
            UTTypeConformsTo: [public.camera-raw-image]
            UTTypeTagSpecification: {public.filename-extension: [kdc]}
          - UTTypeIdentifier: app.rawboy.x3f-raw-image
            UTTypeDescription: Sigma X3F raw image
            UTTypeConformsTo: [public.camera-raw-image]
            UTTypeTagSpecification: {public.filename-extension: [x3f]}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rawboy.viewer
        # tools/release.sh sets both.
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: RawBoy Viewer
        PRODUCT_MODULE_NAME: RawBoyViewer
        # Direct download, not the App Store: no sandbox, so sidecars can be written next to photos.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Native controls (checkboxes, sliders) take RawBoy's amber, not system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  RawBoyViewer:
    build:
      targets:
        RawBoyViewer: all
    run:
      config: Debug
